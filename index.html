<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Kingdom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 800px;
        }
        
        h1 {
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 1.5em;
            margin-bottom: 40px;
            color: #ddd;
        }
        
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a {
            display: inline-block;
            padding: 15px 40px;
            background-color: #0f9d58;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }
        
        a:hover {
            background-color: #0b7d4a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MC Kingdom</h1>
        <p>Welcome to the Kingdom</p>
        <div class="button-group">
            <a href="/server">Visit Server</a>
            <a href="https://github.com/Taupo-Nerd/Kingdom">GitHub</a>
        </div>
    </div>
</body>
</html>
